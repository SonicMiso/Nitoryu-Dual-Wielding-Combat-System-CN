name: Build Nitoryu CN bridge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify bridge
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "A Visual C++ x64 toolchain was not found on the runner."
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat not found: $vcvars"
          }

          Write-Host "Using Visual Studio: $vsPath"
          $buildCmd = "`"$vcvars`" && cl /nologo /LD /EHsc /O2 /MT /std:c++17 `"Nitoryu CN\NitoryuCNBridge.cpp`" /link /OUT:`"NitoryuCNBridge.dll`" && dumpbin /exports NitoryuCNBridge.dll"
          cmd.exe /d /c $buildCmd
          if ($LASTEXITCODE -ne 0) {
            throw "MSVC build failed with exit code $LASTEXITCODE"
          }

          $exports = & (Join-Path $vsPath "VC\Tools\MSVC\") "*\bin\Hostx64\x64\dumpbin.exe" /exports NitoryuCNBridge.dll 2>&1
          $exportText = $exports | Out-String
          Write-Host $exportText
          if ($exportText -notmatch "\?startPlugin@@YAXXZ") {
            throw "Expected RE_Kenshi plugin export was not found."
          }

      - name: Assemble package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "Nitoryu CN"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "Nitoryu CN\Nitoryu CN.mod" $package
          Copy-Item "Nitoryu CN\RE_Kenshi.json" $package
          Copy-Item "NitoryuCNBridge.dll" (Join-Path $package "NitoryuCNBridge.dll")
          Copy-Item "Nitoryu CN\lang" (Join-Path $package "lang") -Recurse
          Compress-Archive -Path "$package\*" -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "Nitoryu-CN-test.zip") -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nitoryu-CN-test
          path: Nitoryu-CN-test.zip
